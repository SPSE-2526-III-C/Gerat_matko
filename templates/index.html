
<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AI Teacher Assistant</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
      }

      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .app__header {
        background: #111827;
        padding: 1rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        border-bottom: 1px solid #374151;
      }

      .title {
        font-size: 1.2rem;
        font-weight: bold;
      }

      .status {
        margin-left: auto;
        font-size: 0.95rem;
        color: #cbd5e1;
      }

      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .bubble {
        max-width: 75%;
        padding: 1rem;
        border-radius: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      .bubble.user {
        background: #facc15;
        color: black;
        align-self: flex-end;
      }

      .bubble.ai {
        background: #1e293b;
        align-self: flex-start;
      }

      .composer {
        display: flex;
        gap: 1rem;
        padding: 1rem;
        background: #111827;
        border-top: 1px solid #374151;
      }

      .composer textarea {
        flex: 1;
        resize: none;
        border: none;
        border-radius: 10px;
        padding: 1rem;
        font-size: 1rem;
        background: #1e293b;
        color: white;
      }

      .composer textarea:disabled {
        opacity: 0.5;
      }

      .composer button {
        border: none;
        border-radius: 10px;
        padding: 0 1.5rem;
        font-weight: bold;
        cursor: pointer;
      }

      .send-btn {
        background: #2563eb;
        color: white;
      }

      .send-btn:disabled {
        background: #475569;
        cursor: not-allowed;
      }

      .init-btn {
        background: #16a34a;
        color: white;
      }

      .init-btn:hover {
        background: #15803d;
      }

      .init-btn:disabled {
        background: #475569;
        cursor: not-allowed;
      }

      .logout-btn {
        background: #dc2626;
        color: white;
      }

      .logout-btn:hover {
        background: #b91c1c;
      }

      .progress {
        padding: 0.5rem 1rem;
        background: #0b1220;
        border-top: 1px solid #374151;
      }

      .progress__bar {
        height: 8px;
        background: #2563eb;
        width: 0%;
        border-radius: 999px;
        transition: width 0.2s;
      }

      .progress__meta {
        display: flex;
        justify-content: space-between;
        margin-top: 0.4rem;
        font-size: 0.9rem;
        color: #94a3b8;
      }

      /* AUTH */

      .auth-container {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      .auth-form {
        width: 340px;
        background: #111827;
        padding: 2rem;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .auth-form h2 {
        margin: 0;
        text-align: center;
      }

      .auth-form input {
        padding: 0.8rem;
        border-radius: 10px;
        border: none;
        background: #1e293b;
        color: white;
      }

      .auth-form button {
        padding: 0.8rem;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: bold;
      }

      .auth-form .primary {
        background: #2563eb;
        color: white;
      }

      .auth-form .secondary {
        background: #475569;
        color: white;
      }

      .auth-error {
        color: #f87171;
        font-size: 0.9rem;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>

    <!-- AUTH -->

    <div class="auth-container" id="auth-container">

      <!-- LOGIN -->

      <div class="auth-form" id="login-form">

        <h2>Prihlásenie</h2>

        <input
          type="text"
          id="login-username"
          placeholder="Používateľ"
        />

        <input
          type="password"
          id="login-password"
          placeholder="Heslo"
        />

        <div class="auth-error" id="login-error"></div>

        <button class="primary" id="login-btn">
          Prihlásiť sa
        </button>

        <button class="secondary" id="register-toggle-btn">
          Registrácia
        </button>

      </div>

      <!-- REGISTER -->

      <div
        class="auth-form hidden"
        id="register-form"
      >

        <h2>Registrácia</h2>

        <input
          type="text"
          id="register-username"
          placeholder="Používateľ"
        />

        <input
          type="password"
          id="register-password"
          placeholder="Heslo"
        />

        <input
          type="password"
          id="register-password2"
          placeholder="Potvrď heslo"
        />

        <div class="auth-error" id="register-error"></div>

        <button class="primary" id="register-btn">
          Registrovať sa
        </button>

        <button class="secondary" id="login-toggle-btn">
          Späť
        </button>

      </div>

    </div>

    <!-- APP -->

    <main
      class="app"
      id="chat-app"
      style="display: none;"
    >

      <!-- HEADER -->

      <header class="app__header">

        <div class="title">
          🎓 AI Teacher Assistant
        </div>

        <button
          id="init-model-btn"
          class="init-btn"
        >
          Inicializovať AI
        </button>

        <button
          id="logout-btn"
          class="logout-btn"
        >
          Odhlásiť sa
        </button>

        <div class="status" id="status">
          🔴 AI neinicializovaná
        </div>

      </header>

      <!-- CHAT -->

      <section
        class="chat"
        id="chat"
      ></section>

      <!-- PROGRESS -->

      <section class="progress">

        <div
          class="progress__bar"
          id="progress-bar"
        ></div>

        <div class="progress__meta">

          <span id="progress-text">
            Čakám...
          </span>

          <span id="timer">
            0.0 s
          </span>

        </div>

      </section>

      <!-- COMPOSER -->

      <form
        class="composer"
        id="composer"
      >

        <textarea
          id="message"
          placeholder="Najprv inicializuj AI..."
          rows="2"
          required
          disabled
        ></textarea>

        <button
          type="submit"
          class="send-btn"
          id="send-btn"
          disabled
        >
          Odoslať
        </button>

      </form>

    </main>

    <!-- JS -->

    <script src="{{ url_for('static', filename='app.js') }}"></script>

  </body>
</html>
